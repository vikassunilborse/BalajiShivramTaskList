
<div class="page-header">
    <div>
        <h1>Edit Task</h1>
        <p class="subtitle">Edit an existing task</p>
    </div>
</div>

<form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
<div class="form-group">
    <label for="title">Title</label>
    <input
    id="title"
    type="text"
    class="form-control"
    formControlName="title"
    placeholder="Enter task title"
    />

    <div
    class="text-danger"
    *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.invalid"
    >
    <small *ngIf="taskForm.get('title')?.errors?.['required']">
        Title is required
    </small>
    <small *ngIf="taskForm.get('title')?.errors?.['minlength']">
        Title must contain at least three characters
    </small>
    </div>
</div>

<div class="form-group">
    <label for="description">Description</label>
    <textarea
    id="description"
    class="form-control"
    formControlName="description"
    rows="4"
    placeholder="Enter task description"
    ></textarea>
</div>

<div class="form-group">
    <label for="status">Status</label>
    <select id="status" class="form-control" formControlName="status">
    <option value="">Select status</option>
    <option [value]="taskStatus.TODO">To Do</option>
    <option [value]="taskStatus.IN_PROGRESS">In Progress</option>
    <option [value]="taskStatus.COMPLETED">Done</option>
    </select>

    <div
    class="text-danger"
    *ngIf="taskForm.get('status')?.touched && taskForm.get('status')?.invalid"
    >
    <small *ngIf="taskForm.get('status')?.errors?.['required']">
        Status is required
    </small>
    </div>
</div>

<div class="form-group">
    <label for="priority">Priority</label>
    <select id="priority" class="form-control" formControlName="priority">
    <option value="">Select priority</option>
    <option [value]="taskPriority.LOW">Low</option>
    <option [value]="taskPriority.MEDIUM">Medium</option>
    <option [value]="taskPriority.HIGH">High</option>
    </select>

    <div
    class="text-danger"
    *ngIf="taskForm.get('priority')?.touched && taskForm.get('priority')?.invalid"
    >
    <small *ngIf="taskForm.get('priority')?.errors?.['required']">
        Priority is required
    </small>
    </div>
</div>

<div class="form-group">
    <label for="dueDate">Due date</label>
    <input
    id="dueDate"
    type="date"
    class="form-control"
    formControlName="dueDate"
    />

    <div
    class="text-danger"
    *ngIf="taskForm.get('dueDate')?.touched && taskForm.get('dueDate')?.invalid"
    >
    <small *ngIf="taskForm.get('dueDate')?.errors?.['required']">
        Due date is required
    </small>
    </div>
</div>

<button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
    Edit Task
</button>
</form>
{{taskForm.invalid}}
